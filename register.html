<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="design.css">
</head>

<body class="register">

  <header>
    <div class="nav-container">
      <h1>StudentHub</h1>
      <button id="hamburger-btn" class="hamburger-btn"
              aria-label="Toggle navigation">&#9776;</button>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="register.html" class="active">Register</a>
      <a href="login.html">Login</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="events.html">Events</a>
      <a href="profile.html">Profile</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html">Admin</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </header>

  <main>
    <h2>Create Account</h2>

    <form id="registrationForm" action="register.php"
          method="POST">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name"
             placeholder="Enter full name"
             minlength="2" maxlength="50"
             pattern="[A-Za-z ]{2,50}" required>
      <span id="nameError" class="error-msg"></span>

      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             placeholder="Choose a username"
             minlength="3" maxlength="50"
             pattern="[A-Za-z0-9_]{3,50}" required>
      <span id="usernameError" class="error-msg"></span>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email"
             placeholder="Enter email" required>
      <span id="emailError" class="error-msg"></span>

      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile"
             placeholder="Enter 10-digit number"
             pattern="[0-9]{10}" maxlength="10"
             inputmode="numeric" required>
      <span id="mobileError" class="error-msg"></span>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Create password"
             minlength="8" required>
      <span id="passwordError" class="error-msg"></span>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword"
             name="confirmPassword"
             placeholder="Confirm password" required>
      <span id="confirmPasswordError" class="error-msg"></span>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="B.Tech">B.Tech</option>
        <option value="MCA">MCA</option>
        <option value="M.Tech">M.Tech</option>
      </select>
      <span id="courseError" class="error-msg"></span>

      <label for="year">Year</label>
      <select id="year" name="year" required>
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
      <span id="yearError" class="error-msg"></span>

      <fieldset class="radio-group">
        <legend>Gender</legend>

        <label>
          <input type="radio" name="gender" value="Male" required>
          Male
        </label>

        <label>
          <input type="radio" name="gender" value="Female">
          Female
        </label>

        <label>
          <input type="radio" name="gender" value="Other">
          Other
        </label>
      </fieldset>
      <span id="genderError" class="error-msg"></span>

      <div class="checkbox-group">
        <input type="checkbox" id="terms"
               name="terms" value="accepted" required>
        <label for="terms">I accept the terms and conditions</label>
      </div>
      <span id="termsError" class="error-msg"></span>

      <button type="submit">Register</button>

    </form>
  </main>

  <footer>
    <p>Made by Niraja</p>
  </footer>

  <script src="javastuff.js"></script>
</body>
</html>
